name: helpdeskpro-db

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: helpdeskpro-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"          # edición gratuita, completa, solo para desarrollo/pruebas
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}   # Docker Compose lee esto de ".env" automáticamente
    ports:
      - "1433:1433"                   # mismo puerto que espera tu application.properties
    volumes:
      - sqlserver_data:/var/opt/mssql # persiste la base entre reinicios del contenedor
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q 'SELECT 1' -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    entrypoint: ["/opt/mssql-tools18/bin/sqlcmd"]
    command: ["-S", "sqlserver", "-U", "sa", "-C", "-b", "-i", "/init/init.sql"]
    environment:
      SQLCMDPASSWORD: ${MSSQL_SA_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./helpdeskpro-db/init/init.sql:/init/init.sql:ro
    depends_on:
      sqlserver:
        condition: service_healthy

  backend:
    build: ./helpdeskpro-backend
    image: factsafe-backend:dev
    env_file:
      - ./helpdeskpro-backend/.env
    environment:
      DB_HOST: sqlserver
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      GOOGLE_GMAIL_PUBSUB_ENABLED: ${GOOGLE_GMAIL_PUBSUB_ENABLED:-false}
      GOOGLE_GMAIL_HISTORICAL_SYNC_ENABLED: ${GOOGLE_GMAIL_HISTORICAL_SYNC_ENABLED:-false}
    ports:
      - "8080:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ./helpdeskpro-backend/src
        - action: rebuild
          path: ./helpdeskpro-backend/pom.xml


  frontend:
    build: ./helpdeskpro-frontend
    image: factsafe-frontend:dev
    env_file:
      - ./helpdeskpro-frontend/.env.local
    ports:
      - "5173:5173"
    depends_on:
      - backend
    develop:
      watch:
        - action: sync
          path: ./helpdeskpro-frontend/src
          target: /app/src
        - action: rebuild
          path: ./helpdeskpro-frontend/package-lock.json


volumes:
  sqlserver_data:
